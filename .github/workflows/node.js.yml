name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    # A real MySQL database for the tests (a fresh one for every run)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: event_checkin_test
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: CiPassword123!
      JWT_SECRET: ci-only-secret

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install server dependencies
      working-directory: server
      run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Install client dependencies
      working-directory: client
      run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Build client
      working-directory: client
      run: npm run build

    - name: Check server code for syntax errors
      working-directory: server
      run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

    - name: Create database tables and test admin
      working-directory: server
      run: npm run db:setup

    - name: Run tests
      working-directory: server
      run: npm test
