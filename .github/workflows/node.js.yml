name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install server dependencies
      working-directory: server
      run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Install client dependencies
      working-directory: client
      run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Build client
      working-directory: client
      run: npm run build

    - name: Check server code for syntax errors
      working-directory: server
      run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

    - name: Smoke test server
      working-directory: server
      run: |
        PORT=5055 node src/index.js &
        SERVER_PID=$!
        sleep 3
        code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5055/api/nothing)
        kill $SERVER_PID
        echo "Server answered with HTTP $code"
        test "$code" = "404"
